name: Test formulae

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fluxzero:
    name: Fluxzero (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS arm64
            runner: macos-14
          - platform: macOS x86_64
            runner: macos-15-intel
          - platform: Linux x86_64
            runner: ubuntu-latest

    steps:
      - name: Check out tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1

      - name: Audit formula
        run: brew audit --strict --online fluxzero-io/tap/fluxzero

      - name: Install formula
        run: brew install fluxzero-io/tap/fluxzero

      - name: Verify commands
        run: |
          fz version
          fluxzero version
          brew test fluxzero
